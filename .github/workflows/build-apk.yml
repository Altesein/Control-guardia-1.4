name: Construir APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Preparar Android
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --no-pub .
          fi
          sed -i 's/android:label="[^"]*"/android:label="Control de Guardias"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Restaurar firma existente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Falta el secreto KEYSTORE_BASE64. No se creará otra firma."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          test -s android/app/key.jks
          keytool -list -keystore android/app/key.jks -storepass 123456 -alias controlkey >/dev/null
          cat << 'PROPERTIES' > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=controlkey
          storeFile=key.jks
          PROPERTIES

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        shell: bash
        run: |
          set +e
          mkdir -p build/diagnostico
          flutter build apk --release 2>&1 | tee build/diagnostico/compilacion.log
          build_status=${PIPESTATUS[0]}
          {
            echo "## Resultado de compilación Android"
            echo
            if [ "$build_status" -eq 0 ]; then
              echo "**Resultado:** compilación completada correctamente."
            else
              echo "**Resultado:** compilación fallida (código $build_status)."
              echo
              echo "### Mensajes relevantes"
              if grep -Ein -C 2 '(^|[[:space:]])(error|exception|failed|failure):|\[ERROR\]|FAILURE: Build failed|What went wrong:' build/diagnostico/compilacion.log | tail -n 100; then
                :
              else
                echo "No se detectaron patrones habituales; se adjunta el registro completo."
              fi
              echo
              echo "El registro completo está disponible en el artefacto **registro-compilacion**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$build_status"

      - name: Publicar registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-compilacion
          path: build/diagnostico/compilacion.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Preparar archivo APK
        if: success()
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Control-de-Guardia-v1.0.4.apk

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Control-de-Guardia-v1.0.4
          path: build/app/outputs/flutter-apk/Control-de-Guardia-v1.0.4.apk
          if-no-files-found: error
          retention-days: 14
