jobs:
  verify:
    name: Verificar código completo
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Preparar proyecto y carpeta de diagnóstico
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          flutter --version > diagnostics/versiones.txt 2>&1
          dart --version >> diagnostics/versiones.txt 2>&1
          if [ ! -d android ]; then
            flutter create --platforms=android --no-pub .
          fi
          sed -i 's/android:label="[^"]*"/android:label="Control de Guardias"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Obtener dependencias
        id: dependencies
        continue-on-error: true
        run: |
          set +e
          flutter pub get > diagnostics/01-dependencias.log 2>&1
          code=$?
          echo "$code" > diagnostics/01-dependencias.exit
          cat diagnostics/01-dependencias.log
          exit 0

      - name: Formatear archivos Dart
        id: format
        continue-on-error: true
        run: |
          set +e
          dart format lib test > diagnostics/02-formato.log 2>&1
          code=$?
          echo "$code" > diagnostics/02-formato.exit
          cat diagnostics/02-formato.log
          exit 0

      - name: Analizar proyecto
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > diagnostics/03-analisis.log 2>&1
          code=$?
          echo "$code" > diagnostics/03-analisis.exit
          cat diagnostics/03-analisis.log
          exit 0

      - name: Ejecutar pruebas
        id: tests
        continue-on-error: true
        run: |
          set +e
          flutter test > diagnostics/04-pruebas.log 2>&1
          code=$?
          echo "$code" > diagnostics/04-pruebas.exit
          cat diagnostics/04-pruebas.log
          exit 0

      - name: Subir diagnóstico de verificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Control-de-Guardia
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Marcar verificación fallida si hubo errores
        if: always()
        run: |
          set -euo pipefail
          failed=0
          for f in diagnostics/*.exit; do
            [ -f "$f" ] || continue
            if [ "$(cat "$f")" != "0" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "La verificación encontró errores. Descarga el artefacto Diagnostico-Control-de-Guardia."
            exit 1
          fi

  build:
    name: Construir APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Preparar Android
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          if [ ! -d android ]; then
            flutter create --platforms=android --no-pub .
          fi
          sed -i 's/android:label="[^"]*"/android:label="Control de Guardias"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Restaurar KeyStore fijo
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: El secreto KEYSTORE_BASE64 no está configurado."
            echo "No se generará una clave nueva porque eso cambiaría la firma de la aplicación."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          if [ ! -s android/app/key.jks ]; then
            echo "ERROR: El archivo android/app/key.jks quedó vacío."
            exit 1
          fi
          keytool -list -keystore android/app/key.jks -storepass 123456 -alias controlkey >/dev/null
          cat << 'EOF' > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=controlkey
          storeFile=key.jks
          EOF

      - name: Obtener dependencias y construir APK
        run: |
          set +e
          flutter pub get > diagnostics/05-build.log 2>&1
          dep_code=$?
          if [ "$dep_code" -eq 0 ]; then
            flutter build apk --release >> diagnostics/05-build.log 2>&1
            build_code=$?
          else
            build_code=99
          fi
          echo "pub_get_exit=$dep_code" >> diagnostics/05-build.log
          echo "build_exit=$build_code" >> diagnostics/05-build.log
          cat diagnostics/05-build.log
          if [ "$dep_code" -ne 0 ] || [ "$build_code" -ne 0 ]; then exit 1; fi

      - name: Renombrar APK para entrega
        if: success()
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/Control-de-Guardia-v1.0.3.apk
          ls -lh build/app/outputs/flutter-apk/Control-de-Guardia-v1.0.3.apk

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Control-de-Guardia-v1.0.3
          path: build/app/outputs/flutter-apk/Control-de-Guardia-v1.0.3.apk
          if-no-files-found: error
          retention-days: 14

      - name: Subir registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Compilacion-Control-de-Guardia
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
